<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#FF6B1A">
<title>Digital Sales Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>/* Layout idea: a quiet white "playbook" — navy ink, one blue for action, gold reserved for SPIN and achievements; sidebar curriculum on desktop, bottom tabs on phones. */
:root {
  --paper: #ffffff;
  --mist: #fff8f3;
  --ink: #171717;
  --ink-2: #57524e;
  --line: #eee7e1;
  --blue: #f4510b;
  --blue-soft: #fff1e8;
  --gold: #c2410c;
  --gold-bright: #ff6b1a;
  --gold-soft: #fff8f3;
  --good: #1b8a57;
  --good-soft: #e8f6ef;
  --bad: #c2453c;
  --bad-soft: #fcecea;
  --ok: #b7791f;
  --ok-soft: #fdf4e3;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 16px;
  --shadow: 0 1px 2px rgba(12, 27, 51, .05), 0 8px 24px -12px rgba(12, 27, 51, .16);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.12; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--blue); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 290px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); padding: 22px 16px 28px; display: flex; flex-direction: column; gap: 18px; background: var(--paper); }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 8px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 38px; height: 38px; border-radius: 11px; background: var(--ink); display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .02em; position: relative; }
.brand-mark::after { content: ''; position: absolute; right: -3px; top: -3px; width: 11px; height: 11px; border-radius: 50%; background: var(--gold-bright); border: 2px solid #fff; }
.brand b { font-family: var(--display); font-size: 16px; display: block; line-height: 1.1; }
.brand small { color: var(--ink-2); font-size: 12.5px; }
.side-prog { background: var(--mist); border-radius: 14px; padding: 12px 14px; }
.side-prog .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }
.side-prog .row b { color: var(--ink); font-family: var(--mono); font-weight: 600; }
.bar { height: 7px; background: var(--line); border-radius: 9px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), #ff8a45); border-radius: 9px; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-h { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); padding: 10px 10px 4px; font-weight: 700; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: var(--ink); text-decoration: none; font-size: 15px; font-weight: 500; }
.nav a:hover { background: var(--mist); }
.nav a.on { background: var(--blue-soft); color: var(--blue); font-weight: 650; }
.nav .num { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; background: var(--mist); color: var(--ink-2); flex: none; }
.nav a.on .num { background: var(--blue); color: #fff; }
.nav .num.done { background: var(--good); color: #fff; }
.nav .t { flex: 1; }
.nav .m { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.nav .star { color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: .04em; }
.main { min-width: 0; padding: 36px 48px 80px; }
.wrap { max-width: 1080px; margin: 0 auto; }
.narrow { max-width: 800px; margin: 0 auto; }
.tabbar { display: none; }
.topbar { display: none; }

/* ---------- common ---------- */
.eyebrow { font-family: var(--mono); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--mist); color: var(--ink-2); font-family: var(--body); letter-spacing: 0; text-transform: none; }
.chip.blue { background: var(--blue-soft); color: var(--blue); }
.chip.gold { background: var(--gold-soft); color: var(--gold); }
.chip.good { background: var(--good-soft); color: var(--good); }
.btn { display: inline-flex; align-items: center; gap: 10px; border: 0; cursor: pointer; padding: 13px 20px; border-radius: 12px; font-weight: 650; font-size: 16px; text-decoration: none; transition: transform .15s, box-shadow .2s, background .2s; }
.btn.primary { background: var(--blue); color: #fff; box-shadow: 0 6px 18px -8px rgba(244, 81, 11, .7); }
.btn.primary:hover { transform: translateY(-1px); background: #d9470a; }
.btn.dark { background: var(--ink); color: #fff; }
.btn.ghost { background: var(--paper); border: 1px solid var(--line); color: var(--ink); }
.btn.ghost:hover { border-color: #d9cfc6; }
.btn.small { padding: 8px 13px; font-size: 14px; border-radius: 10px; }
.btn svg { width: 18px; height: 18px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; }
.grid { display: grid; gap: 16px; }
.muted { color: var(--ink-2); }
.section-h { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin: 48px 0 18px; flex-wrap: wrap; }
.section-h h2 { font-size: 28px; }

/* ---------- dashboard ---------- */
.hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 36px; align-items: center; padding: 8px 0 8px; }
.hero h1 { font-size: clamp(38px, 5.2vw, 60px); font-weight: 750; letter-spacing: -0.035em; margin: 14px 0 16px; }
.hero h1 em { font-style: normal; color: var(--blue); }
.hero h1 .g { color: var(--gold); }
.hero p.lead { font-size: 19px; color: var(--ink-2); max-width: 34em; }
.hero-actions { display: flex; gap: 12px; margin-top: 26px; flex-wrap: wrap; align-items: center; }
.call { background: var(--ink); color: #ece7e2; border-radius: 22px; padding: 20px; box-shadow: 0 30px 60px -30px rgba(12, 27, 51, .55); position: relative; overflow: hidden; }
.call-top { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 12px; color: #b8b0a8; margin-bottom: 14px; }
.call-top .live { display: inline-flex; align-items: center; gap: 7px; color: #fff; }
.call-top .live i { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 4px rgba(61, 220, 132, .18); }
.call-line { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; padding: 9px 10px; border-radius: 12px; font-size: 14.5px; line-height: 1.45; animation: hl 8s infinite; }
.call-line .tag { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 15px; background: rgba(255, 255, 255, .07); color: #fff; }
.call-line.c { grid-template-columns: 1fr 34px; text-align: right; color: #c9c2bb; }
.call-line.c .tag { order: 2; background: transparent; border: 1px dashed #4a4a4a; color: #b8b0a8; font-size: 11px; }
@keyframes hl { 0%, 100% { background: transparent; } 3%, 22% { background: rgba(255, 255, 255, .06); } 25% { background: transparent; } }
.call-line:nth-child(2) { animation-delay: 0s; } .call-line:nth-child(3) { animation-delay: 1s; } .call-line:nth-child(4) { animation-delay: 2s; } .call-line:nth-child(5) { animation-delay: 3s; } .call-line:nth-child(6) { animation-delay: 4s; } .call-line:nth-child(7) { animation-delay: 5s; }
.call-meter { margin-top: 14px; padding-top: 14px; border-top: 1px solid #2e2e2e; font-family: var(--mono); font-size: 12px; color: #b8b0a8; }
.call-meter .bar { background: #2e2e2e; }
.call-meter .bar i { background: linear-gradient(90deg, var(--blue), var(--gold-bright)); width: 100%; animation: grow 8s infinite; }
@keyframes grow { 0% { width: 8%; } 70%, 100% { width: 100%; } }

.dash-top { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; margin-top: 40px; }
.ring-card { display: flex; gap: 24px; align-items: center; }
.ring { width: 132px; height: 132px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .v { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .v b { font-family: var(--display); font-size: 32px; line-height: 1; display: block; }
.ring .v small { font-size: 12px; color: var(--ink-2); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; flex: 1; }
.kpi b { font-family: var(--display); font-size: 26px; display: block; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 13.5px; color: var(--ink-2); line-height: 1.3; display: block; }
.miles { display: flex; flex-direction: column; gap: 12px; }
.miles h3 { font-size: 18px; }
.mtrack { position: relative; height: 10px; background: var(--line); border-radius: 9px; margin: 22px 6px 34px; }
.mtrack > i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--blue), var(--gold-bright)); border-radius: 9px; }
.mstone { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--line); }
.mstone.hit { border-color: var(--gold-bright); background: var(--gold-bright); box-shadow: 0 0 0 5px rgba(255, 107, 26, .2); }
.mstone span { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.mlist { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.mlist div { font-size: 13px; line-height: 1.35; color: var(--ink-2); padding: 10px; border-radius: 10px; background: var(--mist); }
.mlist div.hit { background: var(--gold-soft); color: var(--ink); }
.mlist b { display: block; font-family: var(--mono); font-size: 12px; color: var(--ink); margin-bottom: 2px; }
.continue { margin-top: 16px; display: flex; gap: 16px; align-items: center; justify-content: space-between; background: var(--ink); color: #fff; border-radius: var(--r); padding: 18px 20px; flex-wrap: wrap; }
.continue small { color: #b8b0a8; font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.continue h3 { font-size: 21px; margin-top: 3px; }
.outcomes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.outcome { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 14px; border: 1px solid var(--line); }
.outcome svg { width: 22px; height: 22px; flex: none; color: var(--blue); margin-top: 2px; }
.outcome b { font-weight: 650; display: block; font-size: 15.5px; line-height: 1.35; }
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.mod { display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 18px; padding: 18px; transition: transform .2s, box-shadow .2s, border-color .2s; background: var(--paper); position: relative; }
.mod:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: #ffd2b5; }
.mod .art { height: 128px; border-radius: 12px; background: var(--mist); display: grid; place-items: center; overflow: hidden; }
.mod .art svg { width: 100%; height: 100%; }
.mod.star { border-color: var(--gold-bright); box-shadow: 0 0 0 1px var(--gold-bright) inset; }
.mod h3 { font-size: 21px; }
.mod p { font-size: 14.5px; color: var(--ink-2); line-height: 1.45; }
.mod .foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; font-size: 13px; color: var(--ink-2); gap: 8px; }
.mod .foot .bar { width: 90px; margin: 0; }
.ribbon { position: absolute; top: 14px; right: 14px; }

/* ---------- module + lesson ---------- */
.crumbs { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink-2); margin-bottom: 18px; flex-wrap: wrap; }
.crumbs a { color: var(--ink-2); text-decoration: none; }
.crumbs a:hover { color: var(--blue); }
.mhead { display: grid; grid-template-columns: 1fr 300px; gap: 32px; align-items: center; }
.mhead h1 { font-size: clamp(36px, 4.6vw, 52px); margin: 12px 0 14px; }
.mhead .art { border-radius: 20px; background: var(--mist); aspect-ratio: 4/3; overflow: hidden; }
.mhead .art svg { width: 100%; height: 100%; }
.objs { margin-top: 22px; display: grid; gap: 8px; }
.obj { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; }
.obj svg { width: 20px; height: 20px; color: var(--good); flex: none; margin-top: 3px; }
.evid { margin-top: 18px; display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--ink-2); padding: 10px 14px; background: var(--mist); border-radius: 12px; }
.evid b { color: var(--ink); }
.lessons { display: grid; gap: 10px; margin-top: 32px; }
.lrow { display: grid; grid-template-columns: 44px 1fr auto; gap: 16px; align-items: center; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--ink); transition: border-color .2s, background .2s; }
.lrow:hover { border-color: var(--blue); background: var(--blue-soft); }
.lrow .n { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-family: var(--display); font-weight: 750; background: var(--mist); }
.lrow.done .n { background: var(--good); color: #fff; }
.lrow b { font-size: 17px; font-weight: 650; display: block; }
.lrow span { font-size: 14px; color: var(--ink-2); }
.lrow .min { font-family: var(--mono); font-size: 13px; color: var(--ink-2); }

.lhead h1 { font-size: clamp(32px, 4.2vw, 46px); margin: 12px 0 14px; }
.lhead .lead { font-size: 19px; color: var(--ink-2); max-width: 38em; }
.lprog { display: flex; gap: 5px; margin: 18px 0 0; }
.lprog i { flex: 1; height: 5px; border-radius: 4px; background: var(--line); }
.lprog i.on { background: var(--blue); }
.lprog i.done { background: var(--good); }
.objbox { margin-top: 22px; padding: 16px 18px; border-radius: 14px; background: var(--blue-soft); }
.objbox h4 { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); margin-bottom: 8px; font-weight: 600; }
.blocks { display: flex; flex-direction: column; gap: 22px; margin-top: 30px; }
.blk-h { font-family: var(--display); font-size: 21px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; }
.blk-h .k { font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; }
.lfoot { margin-top: 40px; padding: 22px; border-radius: 18px; background: var(--mist); display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
.lfoot b { font-family: var(--display); font-size: 19px; display: block; }

/* blocks */
.fig { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--paper); }
.fig .canvas { background: linear-gradient(180deg, #fbfcfe, #f3f6fb); padding: 18px; display: grid; place-items: center; }
.fig .canvas svg { width: 100%; max-width: 640px; height: auto; display: block; }
.fig figcaption { padding: 12px 18px; font-size: 14.5px; color: var(--ink-2); border-top: 1px solid var(--line); }
.points { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.point { padding: 16px; border-radius: 14px; background: var(--mist); }
.point b { display: block; font-family: var(--display); font-size: 17px; margin-bottom: 4px; }
.point p { font-size: 15.5px; color: var(--ink-2); line-height: 1.5; }
.note { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 16px 18px; border-radius: 14px; font-size: 15.5px; line-height: 1.55; }
.note .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
.note .ic svg { width: 18px; height: 18px; }
.note.research { background: var(--blue-soft); }
.note.research .ic { background: var(--blue); color: #fff; }
.note.caution { background: var(--ok-soft); }
.note.caution .ic { background: var(--ok); color: #fff; }
.note.tip { background: var(--good-soft); }
.note.tip .ic { background: var(--good); color: #fff; }
.note .lab { font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; display: block; margin-bottom: 3px; }
.note .src { display: inline-block; margin-top: 6px; font-size: 13.5px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { padding: 18px; border-radius: 14px; border: 1px solid var(--line); }
.stat b { font-family: var(--display); font-size: 36px; letter-spacing: -0.03em; color: var(--ink); display: block; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat span { font-size: 14px; color: var(--ink-2); }
.stats-src { font-size: 13px; color: var(--ink-2); margin-top: 8px; }
.example { border-left: 4px solid var(--gold-bright); padding: 4px 0 4px 18px; }
.example .eyebrow { margin-bottom: 6px; }
.example b { font-family: var(--display); font-size: 19px; display: block; margin-bottom: 6px; }
.example p { color: var(--ink-2); }

.convo { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.convo-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--mist); flex-wrap: wrap; }
.convo-h b { font-family: var(--display); font-size: 16.5px; }
.msgs { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; gap: 10px; align-items: flex-end; max-width: 88%; }
.msg .av { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; }
.msg.s .av { background: var(--ink); }
.msg.c { align-self: flex-end; flex-direction: row-reverse; }
.msg.c .av { background: var(--gold); }
.bub { padding: 10px 14px; border-radius: 16px; font-size: 15.5px; line-height: 1.5; position: relative; }
.msg.s .bub { background: var(--blue-soft); border-bottom-left-radius: 5px; }
.msg.c .bub { background: var(--mist); border-bottom-right-radius: 5px; }
.bub .tg { display: inline-block; font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; margin-bottom: 4px; letter-spacing: .04em; }
.tg-S { background: #dbe7fd; color: #1d4fb0; } .tg-P { background: #fde7e4; color: #a63a32; } .tg-I { background: #fdefd2; color: #8e6311; } .tg-N { background: #dcf3e7; color: #17744a; } .tg-x { background: #e8ebf1; color: var(--ink-2); }
.convo.whats .msgs { background: #efe7dd; }
.convo.whats .msg.s .bub { background: #fff; }
.convo.whats .msg.c .bub { background: #d9fdd3; }
.convo.whats .msg { max-width: 82%; }
.convo.whats .msg.s { align-self: flex-end; flex-direction: row-reverse; }
.convo.whats .msg.c { align-self: flex-start; flex-direction: row; }
.convo.whats .av { display: none; }
.convo-f { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.convo-note { padding: 12px 16px; font-size: 14.5px; color: var(--ink-2); border-top: 1px solid var(--line); background: var(--gold-soft); }
.meter { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; font-size: 13px; }
.meter .bar { margin: 0; height: 9px; }
.meter .bar i { background: linear-gradient(90deg, #c2453c, var(--gold-bright), var(--good)); }
.meter .lbl { font-family: var(--mono); font-size: 12px; color: var(--ink-2); min-width: 130px; text-align: right; }
.msg.hidden { display: none; }
.msg.new { animation: pop .35s cubic-bezier(.2, .8, .2, 1); }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.col { border-radius: 14px; padding: 16px 18px; }
.col.bad { background: var(--bad-soft); }
.col.good { background: var(--good-soft); }
.col h4 { font-size: 15.5px; display: flex; gap: 8px; align-items: center; margin-bottom: 10px; font-family: var(--body); font-weight: 700; }
.col.bad h4 { color: var(--bad); } .col.good h4 { color: var(--good); }
.col h4 svg { width: 18px; height: 18px; }
.col ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.col li { font-size: 15px; line-height: 1.45; padding-left: 14px; position: relative; }
.col li::before { content: ''; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .35; }
.when ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
.when li { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 14.5px; }
.apply { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.apply > div { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.apply h4 { font-family: var(--body); font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.apply h4 svg { width: 18px; height: 18px; color: var(--blue); }
.apply p { font-size: 14.5px; color: var(--ink-2); line-height: 1.5; }
.mist { display: grid; gap: 10px; }
.mrow { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); }

.opt:hover:not([disabled]) { border-color: var(--blue); background: var(--blue-soft); }
.opt .l { width: 26px; height: 26px; border-radius: 8px; background: var(--mist); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 600; flex: none; }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .l { background: var(--good); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .l { background: var(--bad); color: #fff; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.ok .l { background: var(--ok); color: #fff; }
.fb { margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-size: 15px; line-height: 1.5; animation: pop .3s; }
.fb.good { background: var(--good-soft); } .fb.bad { background: var(--bad-soft); } .fb.ok { background: var(--ok-soft); }
.fb b { display: block; }
.retry { margin-top: 10px; }
.cust { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; margin-bottom: 16px; }
.cust .face { width: 52px; height: 52px; }
.cust .say { background: var(--mist); padding: 12px 16px; border-radius: 16px; border-top-left-radius: 4px; font-family: var(--display); font-size: 19px; line-height: 1.3; }
.cust small { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.cls-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cls-row:last-of-type { border-bottom: 0; }
.cls-row .tx { font-size: 15.5px; line-height: 1.45; }
.cls-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.cls-btns button { border: 1.5px solid var(--line); background: var(--paper); border-radius: 9px; padding: 6px 10px; font-size: 13.5px; font-weight: 650; cursor: pointer; min-width: 40px; }
.cls-btns button:hover:not([disabled]) { border-color: var(--blue); }
.cls-btns button.right { background: var(--good); border-color: var(--good); color: #fff; }
.cls-btns button.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
.cls-btns button[disabled] { cursor: default; opacity: .5; }
.cls-btns button.right[disabled], .cls-btns button.wrong[disabled] { opacity: 1; }
.cls-score { margin-top: 12px; font-size: 14.5px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.flips { display: grid; gap: 10px; }
.flip { display: grid; grid-template-columns: 1fr 40px 1fr; gap: 10px; align-items: stretch; }
.flip > div { padding: 12px 14px; border-radius: 12px; font-size: 15px; line-height: 1.45; }
.flip .b { background: var(--bad-soft); }
.flip .g { background: var(--good-soft); }
.flip .g.hide { background: var(--mist); color: transparent; position: relative; cursor: pointer; user-select: none; }
.flip .g.hide::after { content: 'Tap to reveal a better question'; position: absolute; inset: 0; display: grid; place-items: center; color: var(--blue); font-weight: 650; font-size: 14px; }
.flip .ar { display: grid; place-items: center; color: var(--ink-2); }

/* interactive widgets */
.widget { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.widget-h { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.svgbox svg { width: 100%; height: auto; display: block; }
.hot { cursor: pointer; }

.panel h4 { font-size: 22px; margin-bottom: 6px; }
.panel .k { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.panel p { color: var(--ink-2); font-size: 15.5px; margin-top: 8px; }
.panel .ex { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--mist); font-size: 15px; }
.panel .ex b { font-size: 12px; font-family: var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); display: block; margin-bottom: 2px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1.5px solid var(--line); background: var(--paper); padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; }

.sl label { display: flex; justify-content: space-between; font-size: 14.5px; font-weight: 600; }
.sl label span { font-family: var(--mono); color: var(--ink-2); }
.sl input { width: 100%; accent-color: var(--blue); }
.tscore { text-align: center; padding: 18px; border-radius: 16px; background: var(--mist); }
.tscore b { font-family: var(--display); font-size: 54px; display: block; line-height: 1; }
.tscore .fr { font-family: var(--mono); font-size: 14px; color: var(--ink-2); margin: 10px 0; }
.tscore p { font-size: 15px; }
.fabx-steps { display: grid; gap: 10px; }
.fstep { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 12px 14px; border-radius: 12px; align-items: start; animation: pop .35s both; }
.fstep .lab { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding-top: 2px; }
.fstep.f { background: var(--mist); } .fstep.a { background: var(--blue-soft); } .fstep.n { background: var(--gold-soft); } .fstep.b { background: var(--good-soft); }
.fstep.a .lab { color: var(--blue); } .fstep.n .lab { color: var(--gold); } .fstep.b .lab { color: var(--good); }
.qual { display: grid; gap: 8px; }
.qual label { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); cursor: pointer; font-size: 15.5px; }
.qual input { width: 20px; height: 20px; accent-color: var(--good); }
.verdict { margin-top: 12px; padding: 14px 16px; border-radius: 12px; font-size: 15.5px; }

/* toolkit */
.tk-grid { display: grid; grid-template-columns: 260px 1fr; gap: 24px; align-items: start; }
.tk-nav { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 20px; }
.tk-nav button { text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 550; display: flex; gap: 10px; align-items: center; }
.tk-nav button svg { width: 18px; height: 18px; color: var(--ink-2); flex: none; }
.tk-nav button:hover { background: var(--mist); }
.tk-nav button.on { background: var(--ink); color: #fff; }
.tk-nav button.on svg { color: var(--gold-bright); }
.tk-pane h2 { font-size: 30px; }
.tk-pane > p { color: var(--ink-2); margin: 6px 0 18px; }
.checks { display: grid; gap: 8px; }
.checks label { display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; font-size: 15.5px; line-height: 1.45; }
.checks input { width: 20px; height: 20px; accent-color: var(--good); margin: 2px 0 0; }
.checks label.on { background: var(--good-soft); border-color: transparent; }
.bank-tabs { margin-bottom: 14px; }
.qline { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.qline .lt { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; }
.qline .lt.S { background: #dbe7fd; color: #1d4fb0; } .qline .lt.P { background: #fde7e4; color: #a63a32; } .qline .lt.I { background: #fdefd2; color: #8e6311; } .qline .lt.N { background: #dcf3e7; color: #17744a; }
.copy { border: 1px solid var(--line); background: var(--paper); border-radius: 9px; padding: 6px 11px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.copy:hover { border-color: var(--blue); color: var(--blue); }
.copy.done { border-color: var(--good); color: var(--good); }
.copy svg { width: 14px; height: 14px; }
.olist { counter-reset: q; display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.olist li { counter-increment: q; display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; }
.olist li::before { content: counter(q, decimal-leading-zero); font-family: var(--mono); font-size: 13px; color: var(--ink-2); }

.script h4 { font-size: 19px; }

.script .st i { font-style: normal; width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 14px; }
.builder { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.fld { display: grid; gap: 4px; }
.fld label { font-size: 13.5px; font-weight: 650; display: flex; gap: 8px; align-items: center; }
.fld label i { font-style: normal; font-family: var(--mono); font-size: 11px; padding: 2px 6px; border-radius: 6px; background: var(--blue-soft); color: var(--blue); }
.fld input, .fld textarea { font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); width: 100%; resize: vertical; background: var(--paper); color: var(--ink); }
.fld input:focus, .fld textarea:focus { border-color: var(--blue); outline: none; }
.out { background: #efe7dd; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.out .wbub { background: #d9fdd3; padding: 12px 14px; border-radius: 14px; border-top-right-radius: 4px; font-size: 15px; line-height: 1.55; white-space: pre-wrap; align-self: flex-end; max-width: 100%; }
.wa-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.wa-item { background: #efe7dd; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.wa-item h4 { font-family: var(--body); font-size: 14px; font-weight: 700; }
.wa-item .wbub { background: #d9fdd3; padding: 10px 12px; border-radius: 12px; border-top-right-radius: 4px; font-size: 14.5px; line-height: 1.5; }
.wa-item .copy { align-self: flex-start; }
.daybar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-family: var(--mono); font-size: 13px; color: var(--ink-2); }

.cert .nm { font-family: var(--display); font-size: 30px; color: var(--blue); margin: 10px 0; }

.prog-rows { display: grid; gap: 10px; }
.prow { display: grid; grid-template-columns: 1fr 160px 70px; gap: 14px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; }
.prow b { font-family: var(--display); font-size: 17px; }
.prow .bar { margin: 0; }
.prow span { font-family: var(--mono); font-size: 13px; color: var(--ink-2); text-align: right; }
.src-list { display: grid; gap: 10px; }
.src-item { padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; }
.src-item a { font-weight: 650; text-decoration: none; }
.src-item a:hover { text-decoration: underline; }
.src-item p { font-size: 14.5px; color: var(--ink-2); margin-top: 4px; }
.src-item small { display: block; font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin-top: 4px; word-break: break-all; }
.evtable { display: grid; gap: 8px; }
.evrow { display: grid; grid-template-columns: 150px 1fr; gap: 14px; padding: 12px 16px; border-radius: 12px; background: var(--mist); font-size: 15px; }

.dialog { position: fixed; inset: 0; background: rgba(12, 27, 51, .45); display: grid; place-items: center; z-index: 50; padding: 20px; }
.dialog .card { max-width: 420px; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .35); }
.dialog h3 { font-size: 22px; margin-bottom: 8px; }
.dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 15px; z-index: 60; animation: pop .3s; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {

  .hero { grid-template-columns: 1fr; }
  .dash-top { grid-template-columns: 1fr; }
  .outcomes { grid-template-columns: repeat(2, 1fr); }
  .mhead { grid-template-columns: 1fr; }

  .apply { grid-template-columns: 1fr; }
}

  .main { padding: 22px 16px 110px; }
  .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(255, 255, 255, .97); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; text-decoration: none; color: var(--ink-2); font-size: 12px; font-weight: 600; border-radius: 10px; }
  .tabbar a svg { width: 22px; height: 22px; }
  .tabbar a.on { color: var(--blue); background: var(--blue-soft); }
  .tk-grid { grid-template-columns: 1fr; }
  .tk-nav { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 6px; }
  .tk-nav button { white-space: nowrap; flex: none; }
  .builder { grid-template-columns: 1fr; }
  .split { grid-template-columns: 1fr; }
  .mlist { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  body { font-size: 16px; }
  .outcomes { grid-template-columns: 1fr; }
  .compare { grid-template-columns: 1fr; }
  .ring-card { flex-direction: column; align-items: stretch; }

  .kpis { grid-template-columns: repeat(3, 1fr); }
  .kpi b { font-size: 22px; }
  .flip { grid-template-columns: 1fr; }

  .lrow { grid-template-columns: 40px 1fr; }
  .lrow .min { display: none; }
  .prow { grid-template-columns: 1fr 70px; }
  .prow .bar { grid-column: 1 / -1; grid-row: 2; }
  .evrow { grid-template-columns: 1fr; gap: 2px; }
  .cls-row { grid-template-columns: 1fr; }
  .cls-btns { justify-content: flex-start; }
  .msg { max-width: 94%; }
  .section-h h2 { font-size: 24px; }
  .fstep { grid-template-columns: 1fr; gap: 2px; }
  .meter { grid-template-columns: 1fr; }
  .meter .lbl { text-align: left; }
  .cert { padding: 24px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

function person(x, y, s, o = {}) {

  return `<g transform="translate(${x} ${y}) scale(${s})">
    <path d="M-62 120 L-62 34 Q-62 4 -30 2 L30 2 Q62 4 62 34 L62 120Z" fill="${top}"/>
    ${o.shirt !== false ? `<path d="M-18 2 L18 2 L0 40Z" fill="#fff"/>` : ''}
    ${o.tie ? `<path d="M-5 6 L5 6 L7 34 L0 44 L-7 34Z" fill="${o.tie}"/>` : ''}
    <rect x="-12" y="-22" width="24" height="28" rx="7" fill="${skin}" opacity=".85"/>
    <g transform="translate(0 -44)">

      <circle r="34" fill="${skin}"/>

      <circle cx="-12" cy="2" r="3.6" fill="#1b1b22"/><circle cx="12" cy="2" r="3.6" fill="#1b1b22"/>

      ${o.must ? `<path d="M-13 11 Q0 5 13 11 Q6 14 0 11 Q-6 14 -13 11Z" fill="${hair}"/>` : ''}
      ${mouth}
    </g></g>`;
}

function tagHTML(tag, ctx) {

  if (ctx.aida) {

    if (tag === 'A') { lab = ctx.seenD ? 'Action' : 'Attention'; }
    if (tag === 'D') ctx.seenD = true;
    return `<span class="tg tg-x">${lab}</span>`;
  }
  if (SPINNAME[tag]) return `<span class="tg tg-${tag}">${tag} · ${SPINNAME[tag]}</span>`;
  return `<span class="tg tg-x">${tag}</span>`;
}

function renderConvo(b, id, ctx) {

  const sBest = sims.filter(s => S.sim[s.id] != null && s.opts[S.sim[s.id]][1] === 'best');
  return `<div class="narrow view"><div class="crumbs"><a href="#home">Dashboard</a> / <span>Progress</span></div><h1 style="font-size:44px;margin:4px 0 8px">Your progress</h1><p class="muted" style="font-size:18px">Saved automatically in this browser on this device.</p>
  <div class="stats" style="margin-top:24px"><div class="stat"><b>${fmtMin(minsDone())}<small style="font-size:18px">/60</small></b><span>minutes learned</span></div><div class="stat"><b>${lessonsDone()}/${LESSONS.length}</b><span>lessons completed</span></div><div class="stat"><b>${qRight.length}/${quizzes.length}</b><span>knowledge checks correct</span></div><div class="stat"><b>${sBest.length}/${sims.length}</b><span>simulations: best answer</span></div></div>
  <div class="section-h"><h2>Modules</h2></div><div class="prog-rows">${MODS.map(m => `<a class="prow" href="#m-${m.id}" style="text-decoration:none;color:inherit"><b>${m.n}. ${m.title}</b>${bar(modDone(m) / m.lessons.length * 100)}<span>${modDone(m)}/${m.lessons.length}</span></a>`).join('')}<a class="prow" href="#toolkit" style="text-decoration:none;color:inherit"><b>Sales Toolkit</b>${bar(S.tkSeen ? 100 : 0)}<span>${S.tkSeen ? '✓' : '—'}</span></a></div>
  <div class="section-h"><h2>Certificate of completion</h2></div>
  ${allDone ? `<div class="cert"><div style="color:var(--gold)">${ico('award').replace('<svg', '<svg style="width:46px;height:46px"')}</div><div class="eyebrow" style="justify-content:center">Digital Sales Playbook</div><h2>Certificate of Completion</h2><p class="muted">This certifies that</p><div class="nm">${esc(S.name || 'Your Name')}</div><p class="muted" style="max-width:30em;margin:0 auto">has completed all 8 modules: Customer Psychology, SPIN Selling, AIDA, FAB, Challenger, LAER, Sandler and Sales Closing.</p><p style="font-family:var(--mono);font-size:13px;margin-top:14px;color:var(--ink-2)">${new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' })}</p>
    <div class="fld" style="max-width:320px;margin:18px auto 0;text-align:left"><label for="certname">Name on certificate</label><input id="certname" data-act="name" value="${esc(S.name)}" placeholder="Type your name"></div></div>`
    : `<div class="cert locked"><div class="muted">${ico('award').replace('<svg', '<svg style="width:40px;height:40px"')}</div><h2 style="font-size:26px">Unlocks after all ${LESSONS.length} lessons</h2><p class="muted">${LESSONS.length - lessonsDone()} lessons to go.</p>${nextLesson() ? `<a class="btn primary" style="margin-top:14px" href="#l-${nextLesson().id}">Continue learning ${ico('arrow')}</a>` : ''}</div>`}
  <div class="lfoot"><div><b>Start over?</b><span class="muted" style="font-size:14px">Clears all progress, answers and checklists on this device.</span></div><button class="btn ghost" data-act="resetask">${ico('refresh')} Reset progress</button></div></div>`;
}
function vSources() {
  const ev = [['SPIN Selling', 'Observational research: 35,000+ sales calls coded by Huthwaite over 12 years. The strongest evidence base in this course.'], ['Challenger', 'Survey research by CEB: 6,000+ reps rated and analysed. Different from observing calls; strongest in complex B2B sales.'], ['Customer psychology', 'Behavioural science (Kahneman & Tversky) and an advisory model (the Trust Equation). Used here as practical lenses.'], ['FAB', 'Classic training model. Rackham’s research tested how features, advantages and benefits work in larger sales.'], ['AIDA', 'Advertising model from 1898. Useful structure, not derived from sales research.'], ['LAER', 'Practitioner training model from Carew International.'], ['Sandler', 'Practitioner training system developed by David Sandler in 1967.'], ['Closing', 'Rackham’s closing research plus practical methods.']];
  return `<div class="narrow view"><div class="crumbs"><a href="#home">Dashboard</a> / <span>Research & sources</span></div><h1 style="font-size:44px;margin:4px 0 8px">Research & sources</h1><p class="muted" style="font-size:18px">Not every framework has the same evidence behind it. Here’s what each one is based on.</p>
  <div class="section-h"><h2>Evidence by framework</h2></div><div class="evtable">${ev.map(([a, b]) => `<div class="evrow"><b>${a}</b><span>${b}</span></div>`).join('')}</div>
  <div class="note caution" style="margin-top:18px"><div class="ic">${ico('caution')}</div><div><span class="lab">How to read the examples</span>The research figures in this course come from the sources below. The business examples and conversations (Kochi architects, Dubai clinics, rupee and dirham amounts) are realistic illustrations written for teaching. They are not research findings.</div></div>
  <div class="section-h"><h2>Sources</h2></div><div class="src-list">${Object.values(SOURCES).map(([t, u, d]) => `<div class="src-item"><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a><p>${esc(d)}</p><small>${esc(u)}</small></div>`).join('')}</div></div>`;
}

/* ---------- router ---------- */
function currentRoute() { return (location.hash || '#home').slice(1) || 'home'; }
function render() {
  COPYTXT = [];
  const h = currentRoute(); let html;
  if (h === 'home') html = vHome();
  else if (h === 'learn') html = vLearn();
  else if (h === 'toolkit') html = vToolkit();
  else if (h === 'progress') html = vProgress();
  else if (h === 'sources') html = vSources();
  else if (h.startsWith('m-') && MBY[h.slice(2)]) html = vModule(MBY[h.slice(2)]);
  else if (h.startsWith('l-') && LBY[h.slice(2)]) html = vLesson(LBY[h.slice(2)]);
  else html = vHome();
  view().innerHTML = html;
  shell();
  const t = { home: 'Dashboard', learn: 'Curriculum', toolkit: 'Sales Toolkit', progress: 'Progress', sources: 'Research & sources' }[h] || (LBY[h.slice(2)]?.title) || (MBY[h.slice(2)]?.title) || 'Dashboard';
  document.title = t + ' · Digital Sales Playbook';
}
function go(h) { if (location.hash === '#' + h) { render(); window.scrollTo(0, 0); } else location.hash = h; }
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

/* ---------- events ---------- */
function rerender(id) {
  const r = BLK[id]; if (!r) return;
  const el = document.getElementById('b-' + id); if (!el) return;
  const tmp = document.createElement('div'); tmp.innerHTML = renderBlock(r.b, r.ctx); el.replaceWith(tmp.firstElementChild);
}
function blkOf(el) { const s = el.closest('[data-blk]'); return s ? s.dataset.blk : null; }
function toast(msg, icon = 'check') {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.innerHTML = ico(icon) + esc(msg); document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); if (btn) { btn.classList.add('done'); btn.innerHTML = ico('check') + ' Copied'; setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = ico('copy') + ' Copy'; }, 1600); } toast('Copied. Paste it into WhatsApp or your notes.'); }
  catch (e) { toast('Couldn’t copy here. Select the text and copy it manually.', 'caution'); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'quiz') { S.ans[id] = +el.dataset.i; save(); rerender(blkOf(el)); }
  else if (a === 'quizreset') { delete S.ans[id]; save(); rerender(blkOf(el)); }
  else if (a === 'sim') { S.sim[id] = +el.dataset.i; save(); rerender(blkOf(el)); }
  else if (a === 'simreset') { delete S.sim[id]; save(); rerender(blkOf(el)); }
  else if (a === 'cls') { (S.cls[id] = S.cls[id] || {})[el.dataset.i] = el.dataset.c; save(); rerender(blkOf(el)); }
  else if (a === 'clsreset') { delete S.cls[id]; save(); rerender(blkOf(el)); }
  else if (a === 'flip') { UI.flips[id] = true; el.classList.remove('hide'); }
  else if (a === 'step') { const n = BLK[id].b.lines.length; UI.steps[id] = Math.min(n, (UI.steps[id] ?? 2) + 1); rerender(id); }
  else if (a === 'stepall') { UI.steps[id] = BLK[id].b.lines.length; rerender(id); }
  else if (a === 'steprestart') { UI.steps[id] = 2; rerender(id); }
  else if (a === 'w') { UI[el.dataset.w] = +el.dataset.k; rerender(blkOf(el)); }
  else if (a === 'done') {
    const l = LBY[id]; const was = S.done[id]; S.done[id] = true; save();
    const i = LESSONS.indexOf(l), next = LESSONS[i + 1];
    if (!was) toast(`Lesson complete · ${fmtMin(minsDone())} of 60 minutes`, 'circleCheck');
    if (next && next.mod.id !== l.mod.id) go('m-' + l.mod.id); else go(next ? 'l-' + next.id : 'toolkit');
  }
  else if (a === 'tk') { S.tk = id; save(); COPYTXT = []; document.getElementById('tkpane').innerHTML = tkPane(TOOLKIT.find(x => x.id === id)); document.querySelectorAll('.tk-nav button').forEach(b => { b.classList.toggle('on', b.dataset.id === id); b.setAttribute('aria-selected', b.dataset.id === id); }); }
  else if (a === 'bank') { S.bank = +el.dataset.i; save(); COPYTXT = []; document.getElementById('tkpane').innerHTML = tkPane(TOOLKIT.find(x => x.id === 'bank')); }
  else if (a === 'copy') { copyText(COPYTXT[+el.dataset.ci], el); }
  else if (a === 'copybuild') { const k = el.dataset.b; const B = BUILD[k]; const v = Object.fromEntries(B.fields.map(([f, , , d]) => [f, S.b[k]?.[f] ?? d])); copyText(B.out(v)); }
  else if (a === 'chkreset') { S.chk[id] = {}; save(); document.getElementById('tkpane').innerHTML = tkPane(TOOLKIT.find(x => x.id === id)); }
  else if (a === 'resetask') { confirmDialog('Reset all progress?', 'This clears completed lessons, answers, checklists and templates on this device. It can’t be undone.', 'Reset progress', () => { const keep = {}; S = { done: {}, ans: {}, cls: {}, sim: {}, chk: {}, daily: {}, last: null, name: '', tkSeen: false, tk: 'prep', bank: 0, b: {}, ...keep }; save(); render(); toast('Progress reset', 'refresh'); }); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'chk') {
    const t = TOOLKIT.find(x => x.id === el.dataset.id);
    if (t.kind === 'daily') { S.daily.on[el.dataset.i] = el.checked; } else { (S.chk[t.id] = S.chk[t.id] || {})[el.dataset.i] = el.checked; }
    save(); el.closest('label').classList.toggle('on', el.checked);
    const on = t.kind === 'daily' ? S.daily.on : S.chk[t.id]; const n = t.items.filter((_, i) => on[i]).length;
    const span = document.querySelector('.daybar span:' + (t.kind === 'daily' ? 'last-child' : 'first-child')); if (span) span.textContent = `${n}/${t.items.length} ${t.kind === 'daily' ? 'done' : 'checked'}`;
    if (n === t.items.length) toast(t.kind === 'daily' ? 'Great day of selling! All done.' : 'Checklist complete. You’re ready.', 'star');
  }
  if (el.dataset.act === 'qual') { UI.qual[el.dataset.k] = el.checked; rerender(blkOf(el)); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.act === 'trust') { UI.trust[el.dataset.k] = +el.value; const id = blkOf(el); const r = BLK[id]; const sc = document.getElementById('tscore'); const tmp = document.createElement('div'); tmp.innerHTML = W.trust(); sc.replaceWith(tmp.querySelector('#tscore')); el.previousElementSibling.querySelector('span').textContent = el.value + '/10'; }
  if (el.dataset.act === 'build') { const k = el.dataset.b; S.b[k] = S.b[k] || {}; S.b[k][el.dataset.f] = el.value; save(); const B = BUILD[k]; const v = Object.fromEntries(B.fields.map(([f, , , d]) => [f, S.b[k][f] ?? d])); document.getElementById('bout-' + k).textContent = B.out(v); }
  if (el.dataset.act === 'name') { S.name = el.value; save(); const nm = document.querySelector('.cert .nm'); if (nm) nm.textContent = el.value || 'Your Name'; }
});
function confirmDialog(title, text, okLabel, onOk) {
  const d = document.createElement('div'); d.className = 'dialog'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
  d.innerHTML = `<div class="card"><h3>${esc(title)}</h3><p class="muted">${esc(text)}</p><div class="row"><button class="btn ghost" data-x="no">Cancel</button><button class="btn dark" data-x="yes">${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(d); d.querySelector('[data-x="no"]').focus();
  d.addEventListener('click', ev => { const x = ev.target.closest('[data-x]')?.dataset.x; if (ev.target === d || x === 'no') d.remove(); if (x === 'yes') { d.remove(); onOk(); } });
}

render();

</script>
</body></html>
